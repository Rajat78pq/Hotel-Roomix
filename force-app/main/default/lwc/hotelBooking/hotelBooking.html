<template>
    <div class="hotel-container">

        <!-- HERO SECTION -->
        <section class="hero-section">
            <div class="hero-overlay"></div>
            <div class="hero-content">
                <div class="hero-badge">
                    <span class="badge-dot"></span>
                    YOUR PERFECT STAY BEGINS HERE
                </div>

                <h1 class="hotel-name">Stay Somewhere Extraordinary.</h1>

                <p class="hotel-tagline">
                    Discover comfort, elegance, and unforgettable experiences
                    with Roomix.
                </p>

                <div class="hero-buttons">
                    <button class="primary-btn" onclick={handleBookNow}>
                        Book Your Stay
                    </button>
                    <button class="secondary-btn" onclick={handleViewRooms}>
                        Explore Our Services
                    </button>
                </div>

                <div class="hero-trust">
                    <span>Luxury</span>
                    <span class="trust-divider">|</span>
                    <span>Comfort</span>
                    <span class="trust-divider">|</span>
                    <span>Exceptional Hospitality</span>
                </div>
            </div>

            <div class="hero-bottom-label">
                EXPERIENCE ROOMIX
            </div>
        </section>

        <!-- AI CONCIERGE SECTION -->
        <section class="ai-assistant-section">
            <div class="ai-assistant-card">
                <div class="ai-left">
                    <div class="ai-icon">
                        <lightning-icon
                            icon-name="utility:sparkles"
                            size="medium"
                            alternative-text="AI">
                        </lightning-icon>
                    </div>

                    <div class="ai-text">
                        <span class="ai-label">YOUR AI CONCIERGE</span>
                        <h2>Meet Roomie.</h2>
                        <p>
                            Your personal AI assistant, ready to help you
                            discover rooms, answer questions, and make
                            your stay effortless.
                        </p>
                    </div>
                </div>

                <div class="ai-right">
                    <div class="ai-feature">
                        <lightning-icon
                            icon-name="utility:chat"
                            size="small">
                        </lightning-icon>
                        <span>Instant answers</span>
                    </div>

                    <div class="ai-feature">
                        <lightning-icon
                            icon-name="utility:date_input"
                            size="small">
                        </lightning-icon>
                        <span>Booking assistance</span>
                    </div>

                    <div class="ai-feature">
                        <lightning-icon
                            icon-name="utility:favorite"
                            size="small">
                        </lightning-icon>
                        <span>Personalized experience</span>
                    </div>

                    <button class="ai-chat-btn" onclick={handleChatWithRoomie}>
                        Chat with Roomie
                        <lightning-icon
                            icon-name="utility:arrow_right"
                            size="x-small">
                        </lightning-icon>
                    </button>
                </div>
            </div>
        </section>

        <!-- SERVICES SECTION -->
        <section class="services-section">
            <div class="section-heading">
                <span class="section-eyebrow">THE ROOMIX EXPERIENCE</span>
                <h2>Everything you need.<br/>Nothing you don't.</h2>
                <p>
                    Thoughtfully designed experiences to make every
                    moment of your stay special.
                </p>
            </div>

            <div class="services-grid">

                <div class="service-card">
                    <div class="service-icon">
                        <lightning-icon
                            icon-name="utility:home"
                            size="medium">
                        </lightning-icon>
                    </div>
                    <h3>Luxury Rooms</h3>
                    <p>
                        Relax in thoughtfully designed spaces where
                        modern comfort meets timeless elegance.
                    </p>
                    <span class="service-number">01</span>
                </div>

                <div class="service-card">
                    <div class="service-icon">
                        <lightning-icon
                            icon-name="utility:food_and_drink"
                            size="medium">
                        </lightning-icon>
                    </div>
                    <h3>Fine Dining</h3>
                    <p>
                        Discover delightful flavors and memorable
                        dining experiences crafted just for you.
                    </p>
                    <span class="service-number">02</span>
                </div>

                <div class="service-card">
                    <div class="service-icon">
                        <lightning-icon
                            icon-name="utility:room_service"
                            size="medium">
                        </lightning-icon>
                    </div>
                    <h3>Room Service</h3>
                    <p>
                        Enjoy convenience and comfort with attentive
                        service delivered right to your room.
                    </p>
                    <span class="service-number">03</span>
                </div>

                <div class="service-card">
                    <div class="service-icon">
                        <lightning-icon
                            icon-name="utility:wellness"
                            size="medium">
                        </lightning-icon>
                    </div>
                    <h3>Spa & Wellness</h3>
                    <p>
                        Slow down, recharge, and give yourself
                        a moment of relaxation and rejuvenation.
                    </p>
                    <span class="service-number">04</span>
                </div>

            </div>
        </section>

        <!-- BOOKING SECTION -->
        <section class="booking-section">
            <div class="booking-layout">

                <div class="booking-intro">
                    <span class="section-eyebrow">PLAN YOUR ESCAPE</span>
                    <h2>Your stay.<br/>Your way.</h2>
                    <p>
                        A few details are all it takes to begin your
                        Roomix experience. Choose your dates and
                        preferences to get started.
                    </p>

                    <div class="booking-benefits">
                        <div class="benefit-item">
                            <span class="benefit-check">✓</span>
                            Flexible stay options
                        </div>
                        <div class="benefit-item">
                            <span class="benefit-check">✓</span>
                            Personalized room selection
                        </div>
                        <div class="benefit-item">
                            <span class="benefit-check">✓</span>
                            Easy booking experience
                        </div>
                    </div>
                </div>

                <div class="booking-form-container">
                    <div class="booking-form-header">
                        <span>ROOMIX RESERVATIONS</span>
                        <h3>Book Your Stay</h3>
                    </div>

                    <div class="booking-form">

                        <!-- CHECK-IN DATE -->
                        <div class="form-field">
                            <lightning-input
                                type="date"
                                label="Check-in Date"
                                name="checkIn"
                                value={checkInDate}
                                min={today}
                                onchange={handleCheckInChange}
                                required>
                            </lightning-input>
                        </div>

                        <!-- CHECK-OUT DATE -->
                        <div class="form-field">
                            <lightning-input
                                type="date"
                                label="Check-out Date"
                                name="checkOut"
                                value={checkOutDate}
                                min={checkOutMin}
                                onchange={handleCheckOutChange}
                                required>
                            </lightning-input>
                        </div>

                        <!-- ROOM TYPE -->
                        <div class="form-field">
                            <lightning-combobox
                                name="roomType"
                                label="Room Type"
                                value={selectedRoomType}
                                placeholder="Select a room"
                                options={roomTypes}
                                onchange={handleRoomTypeChange}
                                required>
                            </lightning-combobox>
                        </div>

                        <!-- GUESTS -->
                        <div class="form-field">
                            <lightning-combobox
                                name="guests"
                                label="Number of Guests"
                                value={selectedGuests}
                                placeholder="Select guests"
                                options={guestOptions}
                                onchange={handleGuestsChange}
                                required>
                            </lightning-combobox>
                        </div>

                        <!-- AVAILABILITY BUTTON -->
                        <button class="availability-btn" onclick={handleCheckAvailability}>
                            Check Availability
                            <lightning-icon
                                icon-name="utility:arrow_right"
                                size="small">
                            </lightning-icon>
                        </button>

                        <!-- VALIDATION MESSAGE -->
                        <template if:true={bookingMessage}>
                            <div class={messageClass} role="status">
                                {bookingMessage}
                            </div>
                        </template>

                        <p class="booking-note">
                            Your journey to a better stay starts here.
                        </p>

                    </div>
                </div>
            </div>
        </section>

        <!-- SPECIAL OFFERS SECTION -->
        <section class="offers-section">
            <div class="section-heading offers-heading">
                <span class="section-eyebrow">SOMETHING EXTRA FOR YOU</span>
                <h2>Make your stay even more special.</h2>
                <p>
                    Explore our exclusive experiences and make
                    your next getaway unforgettable.
                </p>
            </div>

            <div class="offers-grid">

                <div class="offer-card weekend-offer">
                    <div class="offer-content">
                        <span class="offer-tag">WEEKEND ESCAPE</span>
                        <h3>A little getaway.<br/>A lot of memories.</h3>
                        <p>
                            Make time for yourself with a relaxing
                            weekend surrounded by comfort.
                        </p>
                        <button class="offer-btn" onclick={handleBookNow}>
                            Explore Offer
                            <lightning-icon
                                icon-name="utility:arrow_right"
                                size="x-small">
                            </lightning-icon>
                        </button>
                    </div>
                </div>

                <div class="offer-card honeymoon-offer">
                    <div class="offer-content">
                        <span class="offer-tag">ROMANTIC RETREAT</span>
                        <h3>Celebrate love<br/>beautifully.</h3>
                        <p>
                            Create unforgettable moments with a
                            special experience for two.
                        </p>
                        <button class="offer-btn" onclick={handleBookNow}>
                            Explore Offer
                            <lightning-icon
                                icon-name="utility:arrow_right"
                                size="x-small">
                            </lightning-icon>
                        </button>
                    </div>
                </div>

            </div>
        </section>

        <!-- FINAL CTA -->
        <section class="closing-section">
            <div class="closing-content">
                <span class="section-eyebrow">YOUR NEXT CHAPTER STARTS HERE</span>
                <h2>Good stays.<br/>Great stories.</h2>
                <p>
                    Wherever life takes you, make Roomix part of the journey.
                </p>
                <button class="primary-btn closing-btn" onclick={handleBookNow}>
                    Find Your Stay
                </button>
            </div>
        </section>

    </div>
</template>
